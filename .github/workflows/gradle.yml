
name: Build Minecraft Mod JAR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Nadaj uprawnienia Gradle
        run: chmod +x gradlew

      - name: Zbuduj moda i plik JAR
        run: ./gradlew build --no-daemon

      - name: Udostępnij gotowy plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
